# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "PentagonalNumberTheorem"
  authors: [Jonathan Conrad, Paula Muermann, Maryna Viazovska]
  description: >
    Two independent Lean 4 / Mathlib proofs of Euler's pentagonal number theorem. They share no
    lemmas -- neither depends on the other -- so each confirms the result on its own.

    The primary development is combinatorial: Franklin's sign-reversing involution on partitions
    into distinct parts, giving p_e(n) - p_o(n) = (-1)^|k| when n is the generalized pentagonal
    number k(3k-1)/2 and 0 otherwise, stated under a single integer index, together with the
    identification of that signed count with the coefficient of X^n in the truncated product
    over ZZ[[X]]. This is the focus of the project: its blueprint was written by the authors and
    the formalization follows it lemma by lemma, though the Lean proofs themselves were largely
    machine-generated under that plan (see `automation`).

    The second route develops q-Pochhammer symbols, the Gaussian binomial coefficient, Euler's
    identities and the Cauchy identity to prove the Jacobi triple product -- both as a formal
    power series identity over an arbitrary commutative ring and analytically over the complex
    numbers for ‖q‖ < 1 -- and reaches the same theorem for the infinite product by
    specialization. Both its blueprint and its proofs were machine-generated (see `automation`);
    it is included because it is much the more reusable of the two.
  responsible_maintainers: [Jonathan Conrad, Paula Muermann, Maryna Viazovska]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

sources:
  - title: "Pentagonal Number Theorem"
    authors: [Jonathan Conrad, Paula Muermann, Maryna Viazovska]
    type: "unpublished manuscript"
    location: "May 11, 2026 draft; Lemmas 11-24 (Franklin route), Sections 5.1-5.7 (q-series route)"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >
      The source document is the authors' own write-up; the blueprint in blueprint/src/
      tracks it section by section. TODO before submitting: if this manuscript has since
      been posted (arXiv / DOI), add the identifier in an `id:` field here.
  - title: "Introduction to the Theory of Partitions"
    authors: [George E. Andrews]
    type: "book"
    location: "Chapter 1 (Franklin's involution); Chapter 2 (q-series, Jacobi triple product)"
    relationship: "background"
    note: "Standard textbook treatment of both routes; the formalization follows neither verbatim."

related_formalizations:
  - id: "https://arxiv.org/abs/2607.01544"
    relationship: "independent"
    note: >
      Kenny Lau, Seewoo Lee and Ken Ono, "Formalized q-series: The Rogers-Ramanujan Identities
      and Beyond" (Lean 4 / Mathlib; https://github.com/AxiomMath/RogersRamanujan) formalizes
      the Jacobi triple product and Euler's pentagonal number theorem over complete
      non-archimedean rings, via Bailey pairs. Developed independently of this project and we
      claim no priority over it. The overlap is with our q-series route; our Franklin route is
      a combinatorial proof by sign-reversing involution, which theirs does not use, and our
      analytic statements are over the complex numbers for ‖q‖ < 1, a setting their
      non-archimedean hypotheses do not cover.

classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11P81, 11P84, 05A17, 05A19, 33D15]

status:
  scope: >
    Complete formalization of Euler's pentagonal number theorem, primarily via Franklin's
    involution, with an independent q-series route through the Jacobi triple product as an
    accompanying extension. The Jacobi triple product is proved both as a formal-power-series
    identity over an arbitrary commutative ring and analytically over ℂ. No `sorry`, no axioms
    beyond Lean's standard three, no unproved literature dependencies.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "euler_pentagonal_number_theorem_packaged"
      file: "EulerPentagonalNumberTheorem_Franklin/FormalPowerSeries.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "public/comparator.json"
    - declaration: "coeff_prod_eq_pe_sub_po"
      file: "EulerPentagonalNumberTheorem_Franklin/FormalPowerSeries.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "public/comparator.json"
    - declaration: "QSeries.jacobiTripleProduct"
      file: "Qseries_Formalization/QSeries/JacobiTripleProduct.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "public/comparator.json"
    - declaration: "QSeries.euler_pentagonal_number"
      file: "Qseries_Formalization/QSeries/PentagonalNumber.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "public/comparator.json"
    - declaration: "QSeries.FormalPowerSeries.jacobiTripleProduct"
      file: "Qseries_Formalization/QSeries/FPS_Algebra.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: "autonomous"
      models: [Aristotle]
    - method: "agent"
      models: [Aristotle, Claude]
    - method: "manual"
  notes: >
    The Lean proofs in both routes were largely generated by Aristotle (Harmonic). What differs
    between the two is how much human work went into directing and checking that generation, and
    whether the mathematical plan behind it was written by a person.

    Franklin route (EulerPentagonalNumberTheorem_Franklin/, 1264 lines, 123 declarations), the
    primary development: the blueprint was written manually and in detail by the authors. The
    mathematical argument, its decomposition into lemmas and the proof plan are theirs, and the
    formalization follows that blueprint lemma by lemma. The machine-generated proofs then
    received substantially more manual intervention and review than the other route.

    q-series / Jacobi triple product route (Qseries_Formalization/, 3318 lines, 148
    declarations): here the blueprint is machine-generated as well as the proofs. The authors'
    contribution came afterwards -- restructuring the library, renaming its API to be
    mathlib-ready, and reviewing the statements. It is retained because it is much the more
    reusable development: q-Pochhammer symbols, the Gaussian binomial coefficient, Euler's
    identities and the Cauchy identity are general-purpose machinery, whereas the Franklin
    route is specific to this theorem.

    Claude assisted with Lean proof development, blueprint maintenance and CI/deployment
    infrastructure across the project.

fidelity:
  divergences: >
    The Franklin route proves the coefficient identity for the truncated product
    ∏_{k=1}^{n} (1 - q^k), which agrees with the infinite product in degree n; it does not
    itself pass to the infinite product. The q-series route proves the infinite-product form
    directly. The analytic Jacobi triple product is stated for ‖q‖ < 1, ‖z‖ < 1, z ≠ 0
    (`QSeries.jacobiTripleProduct`) and extended to the full punctured disc z ≠ 0 in
    `QSeries.jacobiTripleProduct'`.

review:
  status: "self-assessed"
  reviewers: [Jonathan Conrad, Paula Muermann, Maryna Viazovska]
  notes: >
    The project is accompanied by a blueprint (leanblueprint) in which every formalized
    declaration is tied to a paragraph-level mathematical statement and proof sketch, and
    `leanblueprint checkdecls` verifies in CI that every `\lean{}` annotation names a
    declaration that exists in the compiled environment. CI additionally builds with
    Mathlib's standard linter set enabled and fails on any warning (`lake build --wfail`).
    Review depth differs by route: the Franklin development was reviewed against an
    author-written blueprint lemma by lemma and carries the bulk of the manual intervention,
    whereas the q-series development was reviewed at the level of statements and library
    structure rather than proof by proof. The formalization has not undergone external peer
    review.

alignment:
  statements:
    - source: "Pentagonal Number Theorem (Lemma 24, unified form)"
      lean: "euler_pentagonal_number_theorem_packaged"
      module: "EulerPentagonalNumberTheorem_Franklin.FormalPowerSeries"
      status: "Proved"
      note: >
        The primary result. Franklin's involution, packaged under a single integer index:
        p_e(n) - p_o(n) = (-1)^|k| when 2n = k(3k-1) for some k in ZZ, and 0 otherwise. This
        subsumes the separate zero, non-pentagonal and two pentagonal cases.
    - source: "Pentagonal Number Theorem (Lemma 5 / Theorem 7)"
      lean: "coeff_prod_eq_pe_sub_po"
      module: "EulerPentagonalNumberTheorem_Franklin.FormalPowerSeries"
      status: "Proved"
      note: >
        Identifies the signed partition count with the coefficient of X^n in the truncated
        product prod_{k=1}^{n} (1 - X^k) over ZZ[[X]], which agrees with the infinite product
        in degree n.
    - source: "Pentagonal Number Theorem (Section 5.6)"
      lean: "QSeries.jacobiTripleProduct"
      module: "QSeries.JacobiTripleProduct"
      status: "Proved"
      note: "Accompanying extension: analytic Jacobi triple product for ‖q‖ < 1, ‖z‖ < 1, z ≠ 0."
    - source: "Pentagonal Number Theorem (Section 5.7)"
      lean: "QSeries.euler_pentagonal_number"
      module: "QSeries.PentagonalNumber"
      status: "Proved"
      note: >
        Accompanying extension: the infinite-product form of the same theorem, obtained by
        specializing the Jacobi triple product. Independent of the Franklin route.

acknowledgements: >
  The q-series route depends only on Mathlib. The blueprint and dependency graph are built
  with leanblueprint; API documentation is generated with doc-gen4.
