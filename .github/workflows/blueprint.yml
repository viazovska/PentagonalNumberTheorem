name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Separate concurrency groups for push vs dispatch so manual runs don't cancel ongoing Lean builds
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    # Pages deployments must target the github-pages environment; the actual
    # deploy step lives inside docgen-action, so there is no local step id to
    # take a `url:` from here.
    environment:
      name: github-pages
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build and lint project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          # `--wfail` fails the build if any warning is logged. The mathlib linter
          # set is already enabled via `weak.linter.mathlibStandardSet` in
          # lakefile.toml, so this is what actually enforces it in CI.
          build-args: "--wfail"
          # `lint: true` would run `lake lint`, which needs a lintDriver this
          # project does not define (mathlib no longer ships `runLinter`).
          # Linting is enforced through `build-args` above instead.
          lint: false
          # `mk_all --check` assumes a root directory matching each library name;
          # the QSeries lib uses `srcDir = "Qseries_Formalization"`, so it errors.
          mk_all-check: false

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          homepage: home_page

      # Deployment happens inside docgen-action, on push events only.
      #
      # This workflow deliberately does NOT mirror those deploy steps for
      # `workflow_dispatch`. docgen-action gates its "Build project API
      # documentation" step on `github.event_name == 'push'` while building the
      # blueprint on every event, so a dispatch run produces a blueprint but no
      # `home_page/docs`. Deploying that would replace the live site with one
      # missing /docs/, breaking every `\lean{}` link in the blueprint (they
      # point at doc-gen4's find/#doc/ endpoint) and the site's Documentation
      # button. A manual run therefore builds and validates only -- blueprint
      # compilation and `checkdecls` both still run -- and deploys come from
      # pushes to `main`.
