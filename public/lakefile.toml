# Mathlib-only sub-package holding the Comparator *challenge*.
#
# Why the challenge lives here and the solution does not: `lake exe checkdecls`,
# which CI runs, imports the root module of every lean_lib in the ROOT package.
# Challenge and Solution must declare the same theorem names -- that is what
# Comparator compares -- so if both were root libs the import would collide with
# "environment already contains ...". Keeping the challenge in a dependency package
# takes it out of `ws.root.leanLibs` entirely, while the solution stays in the root
# package where its olean is built by the default target and available to checkdecls.
#
# This package requires only Mathlib, never the parent project, so there is no
# dependency cycle. Because the repository root is the workspace root, Lake resolves
# this package's Mathlib into the root's `.lake/packages` -- a single package tree,
# which is what Comparator's sandbox expects to find pre-built. Do not give this
# package its own `packagesDir` or run Lake from inside this directory.
#
# NOTE: the committed lake-manifest.json here pins the whole dependency set, and because
# this is a path dependency of the root package Lake honours those pins workspace-wide.
# A stale copy silently holds the ROOT project back on an old Mathlib and makes
# `lake exe cache get` fail with "mathlib: failed to fetch cache". Regenerate it on every
# Mathlib bump: temporarily add `packagesDir = "../.lake/packages"`, run `lake update` in
# this directory, remove the setting, then reset `"packagesDir"` in the generated manifest
# to `.lake/packages`. Palomar requires the manifest, so it cannot simply be deleted.
name = "publicChallenge"
version = "0.1.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11"

[[lean_lib]]
name = "Challenge"
