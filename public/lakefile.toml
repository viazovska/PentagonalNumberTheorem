# Separate Lake package for the public submission artefacts (Palomar, and reused
# for later submissions).
#
# Challenge and Solution deliberately declare the *same* theorem names -- that is
# exactly what Comparator compares -- so they can never be imported into one
# environment. Keeping them out of the root package matters because
# `lake exe checkdecls`, which CI runs, imports every root lean_lib and would hit
# the name collision.
#
# This package resolves its dependencies into `public/.lake/packages`, i.e. inside
# the directory submitted to Palomar as the project directory. Do NOT add
# `packagesDir = "../.lake/packages"` to share the parent's downloads: Comparator
# runs the build in a sandbox that only grants write access to the project
# directory, and Lake needs to write a lock while elaborating Mathlib's
# `lakefile.lean` into `lakefile.olean`. Pointing at the parent's package tree put
# that lock outside the sandbox and the verification failed with
# "permission denied ... .lake/packages/mathlib/.lake/config/mathlib/lakefile.olean.lock".
# The cost of keeping it here is a second local Mathlib checkout, which is the
# right trade for a submission that actually verifies.
#
# Lake writes a `lean-toolchain` and `lake-manifest.json` here on first build. Both
# are committed so the submitted commit is reproducible, but the toolchain file must
# be kept identical to the one at the repo root -- a stale copy here would silently
# pin the Lean LSP to the wrong version for files under public/.
name = "public"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

[[require]]
name = "my_project"
path = ".."

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
